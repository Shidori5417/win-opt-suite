name: CI

on:
  push:
    branches: [main, develop, "feat/**", "fix/**", "refactor/**", "chore/**", "docs/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Windows: hedef platform. Ubuntu: core-engine/shared-types'ın
        # platformdan bağımsız kaldığını zorlar (ADR-0001).
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1 # rust-toolchain.toml'u okur
        with:
          components: rustfmt, clippy
      - name: Linux Tauri system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev librsvg2-dev libayatana-appindicator3-dev
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Verify IPC TypeScript bindings freshness
        run: git diff --exit-code apps/desktop/src/bindings.ts
      - name: opti-cli smoke (read-only)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          DB="$RUNNER_TEMP/state.db"
          cargo run -q -p cli -- --db "$DB" --manifests manifests/tweaks validate
          cargo run -q -p cli -- --db "$DB" --manifests manifests/tweaks --json scan
          # dry-run only reads the system; it never writes.
          cargo run -q -p cli -- --db "$DB" --manifests manifests/tweaks dry-run --profile safe
          # CI runners are VMs: gaming tweaks excluded on VMs must be BLOCKED (exit 2).
          set +e
          cargo run -q -p cli -- --db "$DB" --manifests manifests/tweaks dry-run --profile gaming
          rc=$?
          set -e
          [ "$rc" -eq 2 ] || { echo "::error::expected exit 2 (blocked on VM), got $rc"; exit 1; }
          cargo run -q -p cli -- --db "$DB" --manifests manifests/tweaks drift
          cargo run -q -p cli -- --db "$DB" --manifests manifests/tweaks doctor || echo "::warning::doctor reported failures (server runner)"

  policy:
    name: Repository policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Forbid external shell processes
        shell: bash
        run: |
          if grep -rniE '(powershell(\.exe)?|cmd\.exe|"cmd"|reg\.exe|sc\.exe)' --include='*.rs' crates apps 2>/dev/null \
             | grep -vE '^[^:]+:[0-9]+:\s*//' ; then
            echo "::error::External shell invocation found (AGENTS.md §2)"; exit 1
          fi
      - name: unsafe only in crates/providers
        shell: bash
        run: |
          if grep -rn 'unsafe' --include='*.rs' crates apps 2>/dev/null \
             | grep -v '^crates/providers/' | grep -vE 'unsafe_code|//' ; then
            echo "::error::unsafe outside crates/providers"; exit 1
          fi
      - name: Published migrations are immutable
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          changed=$(git diff --name-only --diff-filter=MDR "origin/${{ github.base_ref }}"...HEAD -- migrations/ || true)
          if [ -n "$changed" ]; then
            echo "::error::Published migrations modified: $changed"; exit 1
          fi

  manifests:
    name: Manifest schema validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate manifests/tweaks/*.toml against manifests/schema.json
        shell: bash
        run: |
          if [ ! -f manifests/schema.json ]; then
            echo "schema.json not present yet (Phase 2) — skipping"; exit 0
          fi
          pip install --quiet check-jsonschema==0.33.0
          shopt -s nullglob
          files=(manifests/tweaks/*.toml)
          [ ${#files[@]} -eq 0 ] && { echo "no manifests"; exit 0; }
          check-jsonschema --schemafile manifests/schema.json "${files[@]}"

  frontend:
    name: Desktop frontend (TS strict)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect frontend
        id: detect
        shell: bash
        run: |
          if [ -f apps/desktop/package.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.detect.outputs.present == 'true'
        uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/desktop/package.json
      - if: steps.detect.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - if: steps.detect.outputs.present == 'true'
        run: pnpm --dir apps/desktop install --frozen-lockfile
      - if: steps.detect.outputs.present == 'true'
        run: pnpm --dir apps/desktop typecheck
      - if: steps.detect.outputs.present == 'true'
        run: pnpm --dir apps/desktop build
