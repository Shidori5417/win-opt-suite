schema_version = 1
id = "gaming.disable-game-dvr"
title = "Disable Game DVR"
description = "Sets the AllowGameDVR policy to 0 to turn off background recording and clip capture."
category = "gaming"
risk = "low"
side_effects = "Xbox Game Bar background recording and clip capture are unavailable."
min_windows_build = 22000
profiles = ["gaming"]
references = ["https://learn.microsoft.com/windows/client-management/mdm/policy-csp-admx-gamedvr"]

[[actions]]
provider = "registry"
hive = "HKLM"
key = 'SOFTWARE\Policies\Microsoft\Windows\GameDVR'
value_name = "AllowGameDVR"
value = { type = "dword", data = 0 }
