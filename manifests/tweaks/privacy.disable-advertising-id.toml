schema_version = 1
id = "privacy.disable-advertising-id"
title = "Disable advertising ID"
description = "Sets the DisabledByGroupPolicy policy so apps cannot use the advertising ID for cross-app personalization."
category = "privacy"
risk = "low"
side_effects = "Apps that use the advertising ID for personalized ads or cross-app tracking can no longer read it. Ads become less tailored."
min_windows_build = 22000
profiles = ["safe", "privacy"]
references = ["https://learn.microsoft.com/windows/client-management/mdm/policy-csp-privacy#disableadvertisingid"]

[[actions]]
provider = "registry"
hive = "HKLM"
key = 'SOFTWARE\Policies\Microsoft\Windows\AdvertisingInfo'
value_name = "DisabledByGroupPolicy"
value = { type = "dword", data = 1 }
