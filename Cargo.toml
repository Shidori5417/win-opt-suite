[workspace]
resolver = "3"
members = [
    "crates/shared-types",
    "crates/core-engine",
    "crates/providers",
    "crates/system-probe",
    "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
# İç crate'ler (bağımlılık yönü: AGENTS.md §2 — tek yönlü DAG)
shared-types = { path = "crates/shared-types" }

# Harici bağımlılıklar — yeni ekleme ADR gerektirir (docs/adr/)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
toml = "1"

[workspace.lints.rust]
unsafe_code = "deny"            # Yalnızca crates/providers yerel olarak gevşetir.
unused_must_use = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
indexing_slicing = "warn"
